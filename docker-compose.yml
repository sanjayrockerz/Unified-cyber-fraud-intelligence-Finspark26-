services:
  fuzen-api:
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file:
      - .env
    environment:
      PORT: "8000"
      DB_PATH: /data/finspark.db
      DATABASE_URL: sqlite:////data/finspark.db
    ports:
      - "8000:8000"
    volumes:
      - fuzen-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  fuzen-data:
