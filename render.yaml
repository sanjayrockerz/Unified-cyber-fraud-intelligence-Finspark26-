services:
  - type: web
    name: risk-engine-api
    env: docker
    region: ohio
    plan: free
    branch: deploy
    dockerContext: .
    dockerfilePath: api/Dockerfile
    dockerCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/live
    envVars:
      - key: PORT
        value: 8000
      - key: FUSION_ENV
        value: production
      - key: FUSION_SECURITY_MODE
        value: production
      - key: JWT_SECRET_KEY
        sync: false
      - key: JWT_ISSUER
        value: fusion-risk-os
      - key: JWT_AUDIENCE
        value: fusion-platform
      - key: JWT_TTL_SECONDS
        value: 900
      - key: CORS_ORIGINS
        sync: false
      - key: FUSION_AUTH_CLIENTS_JSON
        sync: false
      - key: FUSION_BANK_USERS_JSON
        sync: false
      - key: DATABASE_URL
        value: ./finspark.db
      - key: BANK_REFRESH_TTL_SECONDS
        value: 2592000
      - key: DB_PATH
        value: ./finspark.db
      - key: FUSION_DEFAULT_TENANT_ID
        value: TENANT_FUSB_001
      - key: FUSION_DEFAULT_APP_ID
        value: com.fusionbank.mobileapp
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USERNAME
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: GRAPH_FALLBACK_ENABLED
        value: true
      - key: LEDGER_SIGNING_KEY
        sync: false
      - key: GATEWAY_WEBHOOK_SECRET
        sync: false
      - key: GATEWAY_TENANT_ID
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: IDENTITY_SUPABASE_REQUIRED
        value: false
      - key: SECURITY_EMAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: SECURITY_EMAIL_FROM
        sync: false
      - key: IPQUALITYSCORE_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: ABUSEIPDB_KEY
        sync: false
