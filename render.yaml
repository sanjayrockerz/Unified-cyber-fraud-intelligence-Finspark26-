services:
  - type: web
    name: risk-engine-api
    env: docker
    region: ohio
    plan: free
    branch: deploy
    dockerContext: .
    dockerfilePath: api/Dockerfile
    envVars:
      - key: PORT
        value: 8000
      - key: FUSION_ENV
        value: production
      - key: FUSION_SECURITY_MODE
        value: production
      - key: JWT_SECRET
        sync: false
      - key: JWT_ISSUER
        value: fusion-risk-os
      - key: JWT_AUDIENCE
        value: fusion-platform
      - key: JWT_TTL_SECONDS
        value: 900
      - key: CORS_ORIGINS
        sync: false
      - key: FUSION_AUTH_CLIENTS_JSON
        sync: false
      - key: FUSION_BANK_USERS_JSON
        # Hackathon demo identity used by the reference APK. The password
        # is FusionDemo!2026; only the PBKDF2 hash is stored here.
        value: >-
          [{"username":"demo_user","password_hash":"pbkdf2_sha256$310000$9f4e2a7c1d6b8e03a5c9d2f1748b6e10$efd382ec9af21935f8cce46c51ef98cfa6b706ccb885a80001e89e5db9cea6df","user_id":"USR_DEMO_001","display_name":"Fusion Demo Customer","email":"demo.user@fusion-risk-os.local","tenant_id":"TENANT_FUSB_001","app_id":"com.fusionbank.mobileapp"}]
      - key: BANK_REFRESH_TTL_SECONDS
        value: 2592000
      - key: DB_PATH
        value: ./finspark.db
      - key: FUSION_DEFAULT_TENANT_ID
        value: TENANT_FUSB_001
      - key: FUSION_DEFAULT_APP_ID
        value: com.fusionbank.mobileapp
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USERNAME
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: GRAPH_FALLBACK_ENABLED
        value: true
      - key: LEDGER_SIGNING_KEY
        sync: false
      - key: GATEWAY_WEBHOOK_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: ABUSEIPDB_KEY
        sync: false
